name: Erdbeben-und-Flut

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inumet
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Erdbeben und Pegel pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 erdbeben_flut.py

      - name: Gedaechtnis speichern
        run: |
          if [ -n "$(git status --porcelain gemeldet_extra.json)" ]; then
            git config user.name "inumet-warner"
            git config user.email "inumet-warner@users.noreply.github.com"
            git add gemeldet_extra.json
            git commit -m "Stand Erdbeben/Flut"
            git pull --rebase
            git push
          fi
